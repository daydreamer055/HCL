spring.application.name=stocksmart
spring.profiles.default=dev

server.port=8081

# Use a local H2 database by default so the app can boot without external DB variables.
# If DB_URL/DB_USERNAME/DB_PASSWORD are set in the environment, those values are used instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:stocksmart;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# JWT_SECRET is required outside the dev profile.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
